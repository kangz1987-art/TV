name: Build 5.8.3 APK from Official Download

on:
  push:
    branches: [ main, upgrade/5.6.8-android7 ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: build-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download Official Apktool JAR
        run: |
          set -euo pipefail
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.12.0/apktool_2.12.0.jar -O /tmp/apktool.jar
          chmod +x /tmp/apktool.jar
          java -jar /tmp/apktool.jar version

      - name: Download official 5.8.3 APK and decode
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/fongmi-official-583"
          curl --fail --location --retry 3 --retry-all-errors \
            --connect-timeout 20 --max-time 600 \
            "https://github.com/15840213978a/fongmi/releases/download/5.8.3-official/mobile-arm64_v8a.apk" \
            --output "$RUNNER_TEMP/fongmi-official-583/mobile-arm64_v8a.apk"
          ls -lh "$RUNNER_TEMP/fongmi-official-583/mobile-arm64_v8a.apk"
          if [ ! -d "decoded_dir" ]; then
            echo "Decoding downloaded APK -> decoded_dir"
            java -jar /tmp/apktool.jar d "$RUNNER_TEMP/fongmi-official-583/mobile-arm64_v8a.apk" -o decoded_dir
          else
            echo "decoded_dir already exists, skipping decode."
          fi

      - name: Build APK with Official Apktool
        run: |
          set -euo pipefail
          java -jar /tmp/apktool.jar b decoded_dir -o unsigned.apk
          ls -lh unsigned.apk

      - name: Configure release signing
        env:
          B64KEY: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          for v in B64KEY KEY_ALIAS STORE_PASSWORD KEY_PASSWORD; do
            if [ -z "${!v:-}" ]; then
              echo "::error::缺少 GitHub Secret: $v"
              exit 1
            fi
          done
          STORE_FILE="$GITHUB_WORKSPACE/.key/release.jks"
          mkdir -p "$(dirname "$STORE_FILE")"
          printf '%s' "$B64KEY" | tr -d '\r\n ' | base64 --decode > "$STORE_FILE"
          test -s "$STORE_FILE"
          keytool -list -keystore "$STORE_FILE" -storepass "$STORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          cat > local.properties <<EOF
          storeFile=$STORE_FILE
          keyAlias=$KEY_ALIAS
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          EOF
          echo "Release signing configured."

      - name: Sign APK
        run: |
          set -euo pipefail
          SIGNED="signed.apk"
          BT="${ANDROID_HOME}/build-tools/37.0.0"
          "$BT/apksigner" sign \
            --ks "$GITHUB_WORKSPACE/.key/release.jks" \
            --ks-key-alias "${{ secrets.RELEASE_KEY_ALIAS }}" \
            --ks-pass "pass:${{ secrets.RELEASE_STORE_PASSWORD }}" \
            --key-pass "pass:${{ secrets.RELEASE_STORE_PASSWORD }}" \
            --out "$SIGNED" unsigned.apk
          "$BT/apksigner" verify --verbose "$SIGNED"
          ls -lh "$SIGNED"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-5.8.3-arm64-${{ github.run_number }}
          path: signed.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v5.8.3-ci-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" --target "$(git rev-parse HEAD)" \
            --title '影视 5.8.3 ARM64' \
            --notes "基于官方 5.8.3 mobile-arm64_v8a.apk 反编译并重新签名。" \
            --prerelease --latest=false \
            signed.apk
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
